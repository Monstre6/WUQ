<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Extracteur de liens</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);min-height:100vh;padding:20px}
.container{max-width:1200px;margin:0 auto;background:#fff;border-radius:12px;box-shadow:0 20px 60px rgba(0,0,0,.3);overflow:hidden}
.header{background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);color:#fff;padding:30px;text-align:center}
.header h1{font-size:2.5em;margin-bottom:10px}
.header p{font-size:1.1em;opacity:.9}
.content{padding:30px;display:grid;grid-template-columns:1fr 1fr;gap:30px}
@media(max-width:968px){.content{grid-template-columns:1fr}}
.section{display:flex;flex-direction:column;min-width:0}
.section h2{margin-bottom:15px;color:#333;font-size:1.3em}
.url-row{display:flex;gap:10px;margin-bottom:15px}
.url-row input{flex:1;min-width:0;padding:12px;border:2px solid #e0e0e0;border-radius:8px;font-size:.95em}
.url-row input:focus,textarea:focus{outline:none;border-color:#667eea;box-shadow:0 0 0 3px rgba(102,126,234,.1)}
.url-row button{flex:0 0 auto}
.sep{text-align:center;color:#888;font-size:.9em;margin-bottom:10px}
textarea{flex:1;padding:15px;border:2px solid #e0e0e0;border-radius:8px;font-family:'Courier New',monospace;font-size:.9em;resize:vertical;min-height:340px}
.button-group{display:flex;gap:10px;margin-top:15px}
button{flex:1;padding:12px 20px;border:none;border-radius:8px;font-size:1em;font-weight:600;cursor:pointer;transition:all .3s ease}
button:disabled{opacity:.6;cursor:wait}
.btn-extract{background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);color:#fff}
.btn-extract:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 10px 20px rgba(102,126,234,.3)}
.btn-paste{background:#2196F3;color:#fff}
.btn-copy{background:#4CAF50;color:#fff}
.btn-copy:hover{background:#45a049}
.btn-clear{background:#f44336;color:#fff}
.btn-clear:hover{background:#da190b}
#output{background:#f9f9f9;border:2px solid #e0e0e0;border-radius:8px;padding:20px;min-height:400px;max-height:600px;overflow-y:auto;font-family:'Courier New',monospace;font-size:.85em;line-height:1.6;white-space:pre-wrap;word-break:break-all}
.info-box{background:#e3f2fd;border-left:4px solid #2196F3;padding:15px;border-radius:4px;margin-bottom:20px;color:#1565c0;font-size:.95em}
.info-box.success{background:#e8f5e9;border-left-color:#4CAF50;color:#2e7d32}
.info-box.error{background:#ffebee;border-left-color:#f44336;color:#c62828}
.opt{margin-top:12px;color:#555;font-size:.9em}
.stats{margin-top:20px;padding:15px;background:#f0f0f0;border-radius:8px;text-align:center}
.stat-item{display:inline-block;margin:0 20px;color:#333}
.stat-number{font-size:1.8em;font-weight:bold;color:#667eea}
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>🎬 Extracteur</h1>
    <p>Extrayez automatiquement les liens</p>
  </div>

  <div class="content">
    <div class="section">
      <h2>📝 Page à analyser</h2>
      <div class="info-box">
        Collez l'<b>adresse de la page</b> ci-dessous, ou le <b>code source</b> (Ctrl+U, Ctrl+A, Ctrl+C). L'extraction se lance toute seule au collage.
      </div>
      <div class="url-row">
        <input id="url" type="text" placeholder="https://..." autocomplete="off">
        <button class="btn-extract" id="btnUrl">🌐 Récupérer</button>
      </div>
      <div class="sep">— ou —</div>
      <textarea id="input" placeholder="Collez ici le code source de la page (ou une adresse)..."></textarea>
      <div class="button-group">
        <button class="btn-extract" id="btnExtract">🔍 Extraire les liens</button>
        <button class="btn-paste" id="btnPaste">📥 Coller</button>
        <button class="btn-clear" id="btnClear">🗑️ Effacer</button>
      </div>
    </div>

    <div class="section">
      <h2>📊 Résultats</h2>
      <div id="message" class="info-box" style="display:none;"></div>
      <div id="output"></div>
      <label class="opt"><input type="checkbox" id="onlyLinks"> Liens seulement (sans titres)</label>
      <div class="button-group">
        <button class="btn-copy" id="btnCopy">📋 Copier tout</button>
      </div>
      <div id="stats" class="stats" style="display:none;"></div>
    </div>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
const EMBED_HOST = 'https://uqload.vc';
const PROXIES = [
  u => 'https://api.allorigins.win/raw?url=' + encodeURIComponent(u),
  u => 'https://corsproxy.io/?url=' + encodeURIComponent(u),
  u => 'https://api.codetabs.com/v1/proxy?quest=' + encodeURIComponent(u)
];
let lastResult = null;
let busy = false;

/* ---------- Utilitaires ---------- */
function showMessage(text, type) {
  const m = $('message');
  m.textContent = text;
  m.className = 'info-box ' + (type || '');
  m.style.display = 'block';
}

function resetResults() {
  lastResult = null;
  $('output').textContent = '';
  $('message').style.display = 'none';
  $('stats').style.display = 'none';
}

function decodeEntities(s) {
  const t = document.createElement('textarea');
  t.innerHTML = s;
  return t.value;
}

// Extrait tous les identifiants Uqload d'un texte (quel que soit le format)
function idsIn(str) {
  const s = decodeEntities(str).replace(/\\\//g, '/');
  const re = /uqload\.[a-z]{2,}\/(?:embed-|d\/)?([a-z0-9]{6,})/gi;
  const out = [];
  let m;
  while ((m = re.exec(s))) out.push(m[1]);
  return out;
}

// Tous les textes contenus dans un objet, à n'importe quelle profondeur
function collectStrings(node, out = []) {
  if (typeof node === 'string') out.push(node);
  else if (node && typeof node === 'object')
    for (const k of Object.keys(node)) collectStrings(node[k], out);
  return out;
}

// Trouve tous les objets qui ont une liste "episodes" (= les saisons)
function collectSeasons(node, acc = []) {
  if (!node || typeof node !== 'object') return acc;
  if (!Array.isArray(node) && node.episodes && typeof node.episodes === 'object') acc.push(node);
  for (const k of Object.keys(node)) collectSeasons(node[k], acc);
  return acc;
}

function asList(x) {
  if (Array.isArray(x)) return x;
  if (x && typeof x === 'object') return Object.values(x);
  return [];
}

function tryParse(s) {
  if (!s) return null;
  s = s.trim();
  for (const v of [s, decodeEntities(s)]) {
    try {
      const o = JSON.parse(v);
      if (o && typeof o === 'object') return o;
    } catch (e) {}
  }
  return null;
}

// Cherche le bloc de données JSON de la page
function findData(text) {
  for (const src of [text, decodeEntities(text)]) {
    const t = src.trim();
    if (t[0] === '{') { const d = tryParse(t); if (d && d.seasons !== undefined || (t.includes('"episodes"'))) return d; }
    const doc = new DOMParser().parseFromString(src, 'text/html');
    const el = doc.getElementById('sr-data');
    if (el) { const d = tryParse(el.textContent); if (d) return d; }
    for (const s of doc.querySelectorAll('script')) {
      if (s.textContent.includes('"episodes"')) { const d = tryParse(s.textContent); if (d) return d; }
    }
  }
  return null;
}

function pageTitle(text) {
  try {
    const doc = new DOMParser().parseFromString(text, 'text/html');
    const h1 = doc.querySelector('h1');
    const t = (h1 && h1.textContent.trim()) || (doc.title || '').trim();
    return t.replace(/\s*[-|–]\s*french-stream.*$/i, '').trim();
  } catch (e) { return ''; }
}

/* ---------- Construction de la liste saisons / épisodes ---------- */
function buildFromData(data) {
  // seasons: Map<numéro, Map<numéro épisode, Set<id>>>
  const seasons = new Map();
  const addLink = (sNum, eNum, ids) => {
    if (!seasons.has(sNum)) seasons.set(sNum, new Map());
    const eps = seasons.get(sNum);
    if (!eps.has(eNum)) eps.set(eNum, new Set());
    ids.forEach(id => eps.get(eNum).add(id));
  };

  const seasonNodes = collectSeasons(data);
  seasonNodes.forEach((s, si) => {
    const sNum = Number(s.n ?? s.number ?? s.season ?? s.num) || (si + 1);
    asList(s.episodes).forEach((ep, ei) => {
      const eNum = Number(ep.n ?? ep.number ?? ep.episode ?? ep.num) || (ei + 1);
      const ids = [];
      collectStrings(ep).forEach(str => ids.push(...idsIn(str)));
      if (ids.length) addLink(sNum, eNum, ids);
    });
  });

  // Film ou structure sans saisons : on prend tous les liens du JSON
  if (!seasonNodes.length) {
    const ids = [];
    collectStrings(data).forEach(str => ids.push(...idsIn(str)));
    if (ids.length) addLink(1, 1, ids);
  }

  return seasons;
}

function sortedNums(keys) {
  return [...keys].sort((a, b) => a - b);
}

/* ---------- Extraction ---------- */
function extractText(text) {
  resetResults();
  if (!text.trim()) {
    showMessage('⚠️ Rien à analyser. Collez une adresse ou le code source de la page.', 'error');
    return false;
  }

  const title = (() => {
    const data = findData(text);
    if (data && data.title) return String(data.title).trim();
    return pageTitle(text) || 'Titre inconnu';
  })();

  const data = findData(text);
  const seasons = data ? buildFromData(data) : new Map();

  // Tous les liens Uqload présents dans le texte brut
  const allRaw = [...new Set(idsIn(text))];

  // Liens trouvés dans le texte mais non rattachés à un épisode
  const assigned = new Set();
  seasons.forEach(eps => eps.forEach(set => set.forEach(id => assigned.add(id))));
  const extras = allRaw.filter(id => !assigned.has(id));

  if (!seasons.size && !extras.length) {
    showMessage('⚠️ Aucun lien Uqload trouvé. Vérifiez que vous avez copié le code source complet (Ctrl+U, Ctrl+A, Ctrl+C) de la page.', 'error');
    return false;
  }

  // Construction du résultat final
  const seasonList = sortedNums(seasons.keys()).map(sNum => {
    const eps = seasons.get(sNum);
    const epList = sortedNums(eps.keys()).map(eNum => ({
      n: eNum,
      links: [...eps.get(eNum)].map(id => `${EMBED_HOST}/embed-${id}.html`)
    }));
    return { n: sNum, episodes: epList };
  });

  const allLinks = [];
  seasonList.forEach(s => s.episodes.forEach(e => allLinks.push(...e.links)));
  const extraLinks = extras.map(id => `${EMBED_HOST}/embed-${id}.html`);
  allLinks.push(...extraLinks);

  render({ title, seasons: seasonList, extraLinks, links: allLinks });
  return true;
}

function render(res) {
  lastResult = res;
  const only = $('onlyLinks').checked;

  let out;
  if (only) {
    out = res.links.join('\n');
  } else {
    const lines = [res.title, ''];
    res.seasons.forEach(s => {
      lines.push(`Saison ${s.n} (${s.episodes.length} épisode${s.episodes.length > 1 ? 's' : ''}) :`);
      s.episodes.forEach(e => {
        lines.push(`Épisode ${e.n} : ${e.links.join(' | ')}`);
      });
      lines.push('');
    });
    if (res.extraLinks.length) {
      lines.push('Non classés :');
      res.extraLinks.forEach(l => lines.push(l));
    }
    out = lines.join('\n');
  }
  $('output').textContent = out;

  const nSeasons = res.seasons.length;
  const nEps = res.seasons.reduce((a, s) => a + s.episodes.length, 0);
  const nLinks = res.links.length;
  showMessage(`✅ Extraction terminée : ${nSeasons} saison(s), ${nEps} épisode(s), ${nLinks} lien(s).` +
    (res.extraLinks.length ? ` ${res.extraLinks.length} lien(s) non classé(s).` : ''), 'success');

  $('stats').innerHTML =
    `<div class="stat-item"><div class="stat-number">${nSeasons}</div><div>Saison(s)</div></div>` +
    `<div class="stat-item"><div class="stat-number">${nEps}</div><div>Épisode(s)</div></div>` +
    `<div class="stat-item"><div class="stat-number">${nLinks}</div><div>Lien(s)</div></div>`;
  $('stats').style.display = 'block';
}

function extractFromInput() {
  const text = $('input').value.trim();
  if (/^https?:\/\/\S+$/i.test(text)) { $('url').value = text; fetchUrl(text); return; }
  extractText($('input').value);
}

/* ---------- Récupération depuis une adresse ---------- */
async function fetchWithTimeout(url, ms) {
  const ctrl = new AbortController();
  const t = setTimeout(() => ctrl.abort(), ms);
  try { return await fetch(url, { signal: ctrl.signal }); }
  finally { clearTimeout(t); }
}

async function fetchUrl(url) {
  url = (url || '').trim();
  if (!url) { showMessage('⚠️ Entrez l\'adresse de la page.', 'error'); return; }
  if (busy) return;
  if (!/^https?:\/\//i.test(url)) url = 'https://' + url;

  busy = true;
  $('btnUrl').disabled = true;
  resetResults();
  let gotPage = false;

  const attempts = [url, ...PROXIES.map(p => p(url))];
  for (let i = 0; i < attempts.length; i++) {
    showMessage(`⏳ Récupération de la page… (essai ${i + 1}/${attempts.length})`, '');
    try {
      const r = await fetchWithTimeout(attempts[i], 15000);
      if (!r.ok) continue;
      const html = await r.text();
      if (html.length < 200) continue;
      gotPage = true;
      if (findData(html) || idsIn(html).length) {
        extractText(html);
        busy = false; $('btnUrl').disabled = false;
        return;
      }
    } catch (e) { /* essai suivant */ }
  }

  busy = false;
  $('btnUrl').disabled = false;
  showMessage(gotPage
    ? '⚠️ Page récupérée mais aucun lien trouvé. Ouvrez la page dans votre navigateur, faites Ctrl+U, Ctrl+A, Ctrl+C et collez le code source dans la zone de gauche.'
    : '❌ Impossible de récupérer la page. Ouvrez la page dans votre navigateur, faites Ctrl+U, Ctrl+A, Ctrl+C et collez le code source dans la zone de gauche.', 'error');
}

/* ---------- Boutons ---------- */
async function pasteClipboard() {
  try {
    const t = await navigator.clipboard.readText();
    $('input').value = t;
    extractFromInput();
  } catch (e) {
    showMessage('❌ Collage automatique refusé par le navigateur. Cliquez dans la zone de texte et utilisez Ctrl+V.', 'error');
  }
}

function copyOutput() {
  const out = $('output').textContent;
  if (!out.trim()) { showMessage('⚠️ Rien à copier. Veuillez d\'abord extraire les liens.', 'error'); return; }
  const ok = () => showMessage('✅ Résultats copiés dans le presse-papiers !', 'success');
  const fallback = () => {
    const t = document.createElement('textarea');
    t.value = out;
    t.style.position = 'fixed';
    t.style.opacity = '0';
    document.body.appendChild(t);
    t.select();
    let done = false;
    try { done = document.execCommand('copy'); } catch (e) {}
    t.remove();
    done ? ok() : showMessage('❌ Erreur lors de la copie', 'error');
  };
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(out).then(ok).catch(fallback);
  else fallback();
}

function clearAll() {
  $('input').value = '';
  $('url').value = '';
  resetResults();
}

/* ---------- Écouteurs ---------- */
$('btnUrl').addEventListener('click', () => fetchUrl($('url').value));
$('btnExtract').addEventListener('click', extractFromInput);
$('btnPaste').addEventListener('click', pasteClipboard);
$('btnClear').addEventListener('click', clearAll);
$('btnCopy').addEventListener('click', copyOutput);
$('onlyLinks').addEventListener('change', () => { if (lastResult) render(lastResult); });
$('input').addEventListener('paste', () => setTimeout(extractFromInput, 100));
$('input').addEventListener('keydown', e => { if (e.ctrlKey && e.key === 'Enter') extractFromInput(); });
$('url').addEventListener('keydown', e => { if (e.key === 'Enter') fetchUrl($('url').value); });
$('url').addEventListener('paste', () => setTimeout(() => {
  if (/^https?:\/\/\S+$/i.test($('url').value.trim())) fetchUrl($('url').value);
}, 100));
</script>
</body>
</html>
